# Release pipeline. It only runs when a tag starting with v is pushed, and it refuses to publish unless:
#   1. the tagged commit is on main, and
#   2. the normal CI check already passed on that exact commit.
# Then it builds, checksums and zips everything, WAITS for the owner to approve the "release" environment in GitHub
# (Settings > Environments > release, required reviewer), and only then attests (build provenance) and publishes.
# Needs no secrets. Never runs for forks or pull requests (only a tag push to this repository starts it).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Tag is on main and CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main. Releases are made only from main."
            exit 1
          fi
      - name: CI must have passed on that exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "check" and .conclusion == "success")] | length')
          if [ "$ok" -lt 1 ]; then
            echo "::error::The CI check did not pass on $GITHUB_SHA. Wait for it to turn green, then push the tag again."
            exit 1
          fi

  build:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - run: flutter build windows --release
      - name: Screenshots (full set)
        shell: pwsh
        env:
          UI_REVIEW: '1'
        run: flutter test test/ui_review/generate_test.dart
      - name: Zip everything and write the SHA-256 checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\ASK-ERP-2.0-windows-$tag.zip"
          Compress-Archive -Path build\web\* -DestinationPath "dist\ASK-ERP-2.0-web-$tag.zip"
          Compress-Archive -Path docs\ui-review\* -DestinationPath "dist\ASK-ERP-2.0-screenshots-$tag.zip"
          Get-ChildItem dist\*.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The owner must click Approve here (Settings > Environments > release). Nothing is published before that.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-files
          path: dist
      - name: Build provenance (proves these files were built by this workflow from this commit)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes --verify-tag --title "$GITHUB_REF_NAME"
