# Runs when a version tag is pushed (for example v2.0.0-proto.1). Builds the Windows and web zips and the screenshot set,
# then creates a GitHub pre-release with them attached. Needs no secrets (the built-in GITHUB_TOKEN is enough).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - run: flutter build windows --release
      - name: Screenshots (full set)
        shell: pwsh
        env:
          UI_REVIEW: '1'
        run: flutter test test/ui_review/generate_test.dart
      - name: Zip everything
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "dist\ERP2-prototype-windows-$tag.zip"
          Compress-Archive -Path build\web\* -DestinationPath "dist\ERP2-prototype-web-$tag.zip"
          Compress-Archive -Path docs\ui-review\* -DestinationPath "dist\ERP2-ui-review-screenshots-$tag.zip"
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*.zip
  # Later (Phase 2+): add macOS and Android jobs here, for example
  #   macos: { runs-on: macos-latest, steps: [checkout, flutter-action, flutter build macos --release, zip, upload] }
  #   android: { runs-on: ubuntu-latest, steps: [checkout, setup-java, flutter-action, flutter build apk --release] }
  # Not enabled yet: they need signing keys, which must live in GitHub Secrets and never in the repository.
