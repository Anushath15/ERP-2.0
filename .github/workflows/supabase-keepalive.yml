name: Supabase keep-alive
# A free Supabase project pauses after about a week without activity. This pings it twice a week.
# Needs two repository VARIABLES (Settings > Secrets and variables > Actions > Variables): SUPABASE_URL and SUPABASE_ANON_KEY.
# Both are public by design (the publishable key can only call ping()), so no secret is used.
on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call ping()
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY" || { echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY variables are not set: the project will pause after a week"; exit 1; }
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
