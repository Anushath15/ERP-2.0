# Runs on every push to main and on every pull request. Needs no secrets. The token is read-only, so a pull request from a
# fork can run these checks but can never publish, release or read a secret. Every action is pinned to a full commit SHA
# (Dependabot keeps them fresh).
# One Windows job (the golden-image tests were made on Windows, and the Windows build is checked in the same run).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - run: flutter build windows --release
